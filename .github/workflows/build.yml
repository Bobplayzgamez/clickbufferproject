name: Build Geode Mod

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows (Geometry Dash 2.2074)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build with the SDK version declared in mod.json
        id: geode-build
        uses: geode-sdk/build-geode-mod@main
        with:
          # Important: read .geode from mod.json instead of using the latest SDK.
          # This project's mod.json pins Geode 4.10.2 for GD 2.2074.
          sdk: given
          target: Win64

      - name: Upload Windows .geode package
        uses: actions/upload-artifact@v4
        with:
          name: ClickBuffer-GD-2.2074
          path: ${{ steps.geode-build.outputs.build-output }}/*.geode
          if-no-files-found: error
